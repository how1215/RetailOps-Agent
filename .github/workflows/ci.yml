name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install project and test tools
        run: python -m pip install -e . pytest httpx ruff
      - name: Lint
        run: ruff check .
      - name: Test
        run: pytest -q

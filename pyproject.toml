[project]
name = "retailops-agent"
version = "0.1.0"
description = "A local-first, policy-aware commerce agent with a reliability harness."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.116.0",
    "langchain-core>=1.0.0",
    "langchain-google-genai>=4.4.0",
    "langchain-openai>=1.0.0",
    "langgraph>=1.0.0",
    "pydantic-settings>=2.10.0",
    "python-dotenv>=1.1.0",
    "sqlalchemy>=2.0.40",
    "typer>=0.16.0",
    "uvicorn>=0.35.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.0",
    "pytest>=8.4.0",
    "pytest-cov>=6.2.0",
    "ruff>=0.12.0",
]

[project.scripts]
retailops = "retailops.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/retailops"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

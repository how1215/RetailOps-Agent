services:
  retailops-api:
    build: .
    environment:
      LLM_MODEL: ${LLM_MODEL:-google/gemma-4-31B-it-qat-w4a16-ct}
      LLM_BASE_URL: ${DOCKER_LLM_BASE_URL:-http://host.docker.internal:8000/v1}
      LLM_API_KEY: ${LLM_API_KEY:-dummy}
      LLM_TEMPERATURE: ${LLM_TEMPERATURE:-0}
      DATABASE_URL: sqlite:////app/data/retailops.db
      POLICY_DIR: /app/policies
      TRACE_DIR: /app/traces
      AGENT_SYSTEM_PROMPT_PATH: /app/prompts/retailops_system.txt
      POLICY_CONTEXT_LIMIT: ${POLICY_CONTEXT_LIMIT:-4}
      MAX_LLM_CALLS: ${MAX_LLM_CALLS:-8}
      MAX_TOOL_CALLS: ${MAX_TOOL_CALLS:-12}
    ports:
      - "8080:8080"
    volumes:
      - retailops-data:/app/data
      - retailops-traces:/app/traces
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health')"]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  retailops-data:
  retailops-traces:
